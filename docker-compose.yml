services:
  postgres:
    image: postgres:17-alpine
    container_name: plexus-db
    environment:
      POSTGRES_DB: ${DB_DATABASE:-plexusdb}
      POSTGRES_USER: ${DB_USERNAME:-plexus}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-plexus}
      TZ: America/Recife
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: plexus-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@plexus.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-plexus}
      TZ: America/Recife
    depends_on:
      - postgres
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  postgres_data:
  pgadmin_data: